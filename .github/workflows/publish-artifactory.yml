name: Publish to Artifactory

# Publishes to Nordix Artifactory, never to PyPI or Test PyPI.
# Triggers:
#   - push to staticx-est: publishes a snapshot to
#       allies/staticx-est/snapshots/<version>/
#   - workflow_dispatch (from staticx-est): same as above, for manual runs
#   - release: publishes to allies/staticx-est/<version>/
#
# Versioning:
#   The published version is derived from BASE_VERSION in staticx/version.py:
#     - release:  <BASE_VERSION>              e.g. 0.14.2.1
#     - snapshot: <BASE_VERSION>.<run_id>     e.g. 0.14.2.1.41820990636
#   BASE_VERSION is NOT bumped automatically. 
#   Bump it by hand (0.14.2.1 -> 0.14.2.2 -> ...) BEFORE each release and before pushing to staticx-est when you want snapshots to be named after the new version.
#   Otherwise the new artifacts will be published under the old version name.
#   BASE_VERSION must be a valid PEP 440 version (numbers only)
#   The git tag must be "v" + BASE_VERSION (e.g. v0.14.2.1) and must exist before any build runs or version.py fails with "Git revision different from base version".
#
#   Bumping (create tag after bumping version but push them at the same time):
#     1. Edit BASE_VERSION in staticx/version.py and commit it.
#     2. Tag that same commit:  git tag v<BASE_VERSION>
#     3. Push the branch and the tag together:
#          git push origin <branch> v<BASE_VERSION>
#     4. Merge the PR with a merge commit (not squash/rebase), so the tag stays reachable from staticx-est.
#     5. To release, publish a GitHub release on the existing tag.
on:
  workflow_dispatch:

  # On every push to staticx-est, push a snapshot to Artifactory
  push:
    branches:
      - staticx-est

  # On new releases, push a release to Artifactory
  release:
    types: [published]


jobs:
  build:
    if: ${{ github.repository == 'Nordix/staticx' }}
    runs-on: ubuntu-latest

    # Map a step output to a job output
    outputs:
      ENV_NAME: ${{ steps.environment_select.outputs.ENV_NAME }}
      PKG_VERSION: ${{ steps.environment_select.outputs.PKG_VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
    - name: Unshallow checkout
      run: git fetch --prune --unshallow

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build
      env:
        BOOTLOADER_CC: /usr/bin/musl-gcc
      run: |
        # For 'staticx-est' branch builds, set append the run ID to the version
        if [ "${{ github.ref_type }}" == "branch" ]; then
          export CI_VERSION_BUILD_NUMBER=${{ github.run_id }}
        fi

        python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-dist
        path: dist/

    - name: Environment select
      # https://www.codewrecks.com/post/github/choose-environment-from-branch/
      # https://docs.github.com/en/actions/using-jobs/defining-outputs-for-jobs
      # https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
      id: environment_select
      run: |
        # Determine environment to publish to
        echo "github.event_name=\"${{ github.event_name }}\""
        echo "github.ref_type=\"${{ github.ref_type }}\""
        echo "github.ref=\"${{ github.ref }}\""

        case "${{ github.event_name }}" in
          push|workflow_dispatch)
            echo "Triggered by ${{ github.event_name }} on ${{ github.ref }}"
            if [ "${{ github.ref_type }}" == "branch" ]; then
              if [ "${{ github.ref_name }}" == "staticx-est" ]; then
                echo "Will deploy snapshot to Artifactory"
                echo "ENV_NAME=Artifactory-Snapshot" >> $GITHUB_OUTPUT
              else
                echo "Unexpected ref_name: \"${{ github.ref_name }}\""
                exit 6
              fi
            else
              echo "Unexpected ref_type: \"${{ github.ref_type}}\""
              exit 6
            fi
            ;;

          release)
            echo "Triggered by release to ${{ github.ref }}"
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "Will deploy release to Artifactory"
              echo "ENV_NAME=Artifactory-Release" >> $GITHUB_OUTPUT
            else
              echo "Unexpected ref_type: \"${{ github.ref_type}}\""
              exit 6
            fi
            ;;

          *)
            echo "Unexpected trigger: ${{ github.event_name }}"
            exit 6
            ;;
        esac

        # Determine built package version
        pkg_version=$(awk '{ if ($1 == "Version:") print $2 }' <staticx_est.egg-info/PKG-INFO)
        echo "Package version: $pkg_version"
        echo "PKG_VERSION=$pkg_version" >> $GITHUB_OUTPUT


  artifactory-publish:
    name: Upload ${{ needs.build.outputs.ENV_NAME }} to Artifactory
    if: ${{ github.repository == 'Nordix/staticx' }}
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.ENV_NAME }}
      url: https://artifactory.nordix.org/ui/repos/tree/General/allies
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-dist
        path: dist/

    # 'allies' is a Generic Artifactory repository (not a PyPI index), so the
    # files are uploaded directly with HTTP PUT rather than with twine.
    - name: Publish
      env:
        ARTIFACTORY_URL: https://artifactory.nordix.org/artifactory/allies
        ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        PKG_VERSION: ${{ needs.build.outputs.PKG_VERSION }}
        ENV_NAME: ${{ needs.build.outputs.ENV_NAME }}
      run: |
        # Snapshots go under staticx-est/snapshots/, releases under staticx-est/
        case "$ENV_NAME" in
          Artifactory-Snapshot) base="staticx-est/snapshots/$PKG_VERSION" ;;
          Artifactory-Release)  base="staticx-est/$PKG_VERSION" ;;
          *)
            echo "Unexpected environment: \"$ENV_NAME\""
            exit 6
            ;;
        esac

        for f in dist/*; do
          name=$(basename "$f")
          sha256=$(sha256sum "$f" | awk '{ print $1 }')
          target="$ARTIFACTORY_URL/$base/$name"
          echo "Uploading $name (sha256: $sha256)"
          echo "  -> $target"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $ARTIFACTORY_TOKEN" \
            --header "X-Checksum-Sha256: $sha256" \
            --upload-file "$f" \
            "$target"
          echo
        done
